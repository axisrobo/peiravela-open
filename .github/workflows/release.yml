name: Build binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Binaries are prebuilt from the AGPL core by the core's
# scripts/mirror-binaries.ps1 and committed under bin/ (gitignored, added with
# git add -f). This workflow uploads those committed binaries to the GitHub
# Release for each tag, so no cross-repo checkout token is required.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify binaries are present and versioned
        run: |
          test -f bin/peiravela-api-server
          test -f bin/peiravela-control-plane
          test -f bin/peiravela-api-server.exe
          test -f bin/peiravela-control-plane.exe
          strings bin/peiravela-api-server | grep -q "${{ github.ref_name }}"
          strings bin/peiravela-control-plane | grep -q "${{ github.ref_name }}"

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/peiravela-api-server
            bin/peiravela-control-plane
            bin/peiravela-api-server.exe
            bin/peiravela-control-plane.exe
          generate_release_notes: true
