name: Build binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: axisrobo/peiravela
          path: core

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: core/go.work.sum

      - name: Build core binaries
        working-directory: core
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 go build -o ../dist/peiravela-api-server ./backend/cmd/api-server
          CGO_ENABLED=0 go build -o ../dist/peiravela-control-plane ./backend/cmd/control-plane
          CGO_ENABLED=0 go build -o ../dist/peiravela-worker ./backend/cmd/worker

      - name: Upload binaries to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/peiravela-api-server
            dist/peiravela-control-plane
            dist/peiravela-worker
          generate_release_notes: true
